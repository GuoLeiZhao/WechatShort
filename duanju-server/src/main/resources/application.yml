
# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
    connection-timeout: 5000ms
  port: 8183
  servlet:
    context-path: /sqx_fast
wx:
  miniapp:
    # 微信小程序/公众号凭证：更换账号只改这里即可（name 用于区分，勿改）
    configs:
      - name: app1          # 小程序（App 登录/播放器用这个）
        appid: __WX_APPID__
        secret: __WX_SECRET__
        token: __WX_TOKEN__
        aesKey: __WX_AESKEY__
        appKey: __WX_APPKEY__        # 虚拟支付 appKey，不用可留空
        msgDataFormat: JSON
      - name: app1gzh       # 公众号
        appid: __WX_OFA_APPID__
        secret: __WX_OFA_SECRET__
        appKey: __WX_OFA_APPKEY__
        msgDataFormat: JSON
      - name: app2        # 短剧平台（多租户，不用可删除本条）
        appid: __WX_APP2_APPID__
        secret: __WX_APP2_SECRET__
        token: __WX_APP2_TOKEN__
        aesKey: __WX_APP2_AESKEY__
        appKey: __WX_APP2_APPKEY__
        msgDataFormat: JSON

